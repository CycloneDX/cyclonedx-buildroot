# encoding: utf-8

name: Python CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'        # Matches every branch
    tags:
      - 'v*'
  schedule:
    # schedule daily tests, since some dependencies are not intended to be pinned
    # this means: at 23:42 every day
    - cron: '42 23 * * *'

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

env:
  PYTHON_VERSION_DEFAULT: "3.12"
  POETRY_VERSION: "2.1.1"
  REPORTS_DIR: CI_reports
  TESTS_REPORTS_ARTIFACT: tests-reports

# see https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token
permissions: {}

jobs:
  # coding-standards:
    # TODO: run flake8

  static-code-analysis:
    name: StaticCodingAnalysis (py${{ matrix.python-version}} ${{ matrix.toxenv-factors }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.13'  # latest
            os: ubuntu-latest
            toxenv-factors: '-current'
          - # python-version: '3.8'   # lowest supported  << not supported by poetry 2
            python-version: '3.9'
            os: ubuntu-latest
            toxenv-factors: '-lowest'
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@v6
      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        run: brew install gettext
      - name: Setup Python Environment
        # see https://github.com/actions/setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: 'x64'
      - name: Install poetry
        # see https://github.com/marketplace/actions/setup-poetry
        uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tox
        run: poetry run tox r -e mypy${{ matrix.toxenv-factors }} -s false

  security-issues:
    name: find Security Issues
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@v6
      - name: Setup Python Environment
        # see https://github.com/actions/setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          architecture: 'x64'
      - name: Install poetry
        # see https://github.com/marketplace/actions/setup-poetry
        uses: Gr1N/setup-poetry@v9
        with:
          poetry-version: ${{ env.POETRY_VERSION }}
      - name: Install dependencies
        run: poetry install --no-root
      - name: Run tox
        run: poetry run tox run -e bandit -s false

  install-and-run:
    name: install & run "${{matrix.command}}" (${{matrix.os}})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        command:
          - generateBuildrootSBOM --help          # test legacy entrypoint
          - cyclonedx-buildroot --help            # test entrypoint
          - python -m cyclonedx_buildroot --help  # test module
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        # see https://github.com/actions/checkout
        uses: actions/checkout@v6
      - name: Install gettext (macOS)
        if: runner.os == 'macOS'
        run: brew install gettext
      - name: Setup Python Environment
        # see https://github.com/actions/setup-python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION_DEFAULT }}
          architecture: 'x64'
      - name: Upgrade pip
        run: pip install --upgrade pip
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Add Poetry to PATH
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: Install self
        run: pip install .
      - name: run command
        run: ${{matrix.command}}

  build-and-test:
    name: Test (${{ matrix.os }} py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
        python-version: ["3.13", "3.12", "3.11", "3.10", "3.9"]

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Poetry
        # Using pip is the most reliable cross-platform way to ensure
        # it's in the current python path
        run: |
          python -m pip install --upgrade pip
          python -m pip install poetry==${{ env.POETRY_VERSION }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Create reports directory
        shell: bash
        run: mkdir -p ${{ env.REPORTS_DIR }}/coverage

      - name: Run tox
        run: poetry run tox r -e py -s false

      - name: Generate coverage reports
        if: always()
        shell: bash
        run: |
          poetry run coverage report -m || true
          poetry run coverage xml -o "${{ env.REPORTS_DIR }}/coverage/${{ matrix.os }}_${{ matrix.python-version }}.cobertura.xml"
      - name: Artifact reports
        if: ${{ ! cancelled() }}
        # see https://github.com/actions/upload-artifact
        uses: actions/upload-artifact@v5
        with:
          name: '${{ env.TESTS_REPORTS_ARTIFACT }}_bnt_${{ matrix.os }}_py${{ matrix.python-version }}'
          path: ${{ env.REPORTS_DIR }}
          if-no-files-found: warn

  report-coverage:
    name: Publish test coverage
    needs: [ "build-and-test" ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install Poetry
        run: curl -sSL https://install.python-poetry.org | python3 -
      - name: Add Poetry to PATH
        run: echo "${HOME}/.local/bin" >> $GITHUB_PATH
      - name: fetch test artifacts
        # see https://github.com/actions/download-artifact
        uses: actions/download-artifact@v6
        with:
          pattern: '${{ env.TESTS_REPORTS_ARTIFACT }}_bnt_*'
          merge-multiple: true
          path: ${{ env.REPORTS_DIR }}
      - name: Run codacy-coverage-reporter
          env:
            CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
            CODACY_API_BASE_URL: https://api.codacy.com
            CODACY_TIMEOUT: 120  # Increase timeout in seconds if supported
          if: ${{ env.CODACY_PROJECT_TOKEN != '' }}
          uses: codacy/codacy-coverage-reporter-action@v1
          with:
            project-token: ${{ env.CODACY_PROJECT_TOKEN }}
            coverage-reports: ${{ env.REPORTS_DIR }}/coverage/*
          continue-on-error: true
